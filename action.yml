name: 'WP Release Checksums'
description: 'Write a WordPress JSON or GNU SHA-256 checksums manifest of the distributed plugin or theme files.'
author: 'WP Elevator'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  source-dir:
    description: 'Directory to hash. Defaults to the repository root.'
    default: ''
  config:
    description: 'Path to a JavaScript release config for integrity.codec. Defaults to the conventional config in the repository root.'
    default: ''
  checksums-format:
    description: 'Manifest format: wordpress-json or sha256sum. Defaults to integrity.codec or wordpress-json; sha256sum defaults to SHA256SUMS.'
    default: ''
  slug:
    description: 'Plugin or theme slug.'
    default: ${{ github.event.repository.name }}
  version:
    description: 'Version for the manifest and its filename. Defaults to the Version header.'
    default: ''
  filename-format:
    description: 'JSON filename with {slug} and {version}, followed by .checksums.json. Defaults to {slug}.{version}; other codecs use their default filename unless output is set.'
    default: ''
  output:
    description: 'Path of the manifest. Defaults to the JSON filename or codec filename in the repository root.'
    default: ''
  distignore:
    description: 'Path to the ignore file, or "false" to not read one. Defaults to .distignore in source-dir when present.'
    default: ''
  exclude:
    description: 'Extra gitignore-style patterns to leave out, separated by commas or new lines, like "build/,assets/*,images/**/*".'
    default: ''
  exclude-gitattributes:
    description: 'Also exclude paths marked export-ignore in Git attributes. Requires source-dir to be inside a Git repository.'
    default: 'false'
  type:
    description: 'plugin or theme. Defaults to the type detected from the headers, else plugin.'
    default: ''
  force:
    description: 'Overwrite an existing manifest.'
    default: 'false'

outputs:
  checksums-path:
    description: 'Absolute path of the checksums manifest.'
  files:
    description: 'Number of hashed files.'

runs:
  using: 'node24'
  main: 'dist/index.js'
